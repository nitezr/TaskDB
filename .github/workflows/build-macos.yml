name: Build macOS DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    # Docs and the website never need a build.
    paths-ignore: ["**.md", "docs/**", "site/**"]
  workflow_dispatch:

# A newer run cancels the older one on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # macOS minutes count 10x on a private repo, so the DMG builds only on demand
  # (Actions › Build macOS DMG › Run workflow) or for a v* release tag. Pushes run tests only.
  dmg:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Universal build runs on both Apple Silicon and Intel Macs.
      # Ad-hoc signed only (signingIdentity "-") until the Apple Developer account exists.
      - run: npx tauri build --target universal-apple-darwin
        env:
          # Set these as repository variables once the Lemon Squeezy product exists.
          VITE_LS_STORE_ID: ${{ vars.LS_STORE_ID }}
          VITE_LS_PRODUCT_ID: ${{ vars.LS_PRODUCT_ID }}
          VITE_LS_CHECKOUT_URL: ${{ vars.LS_CHECKOUT_URL }}
          # URL of the deployed worker/ (Connect with Notion). Empty = paste-secret onboarding only.
          VITE_NOTION_AUTH_URL: ${{ vars.NOTION_AUTH_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: TaskDB-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
