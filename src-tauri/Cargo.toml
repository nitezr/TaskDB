[package]
name = "taskdb"
version = "0.1.0"
description = "Todoist-style task manager on top of your Notion"
edition = "2021"

[lib]
name = "taskdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["tray-icon", "devtools"] }
tauri-plugin-http = "~2.6"
tauri-plugin-sql = { version = "~2.4", features = ["sqlite"] }
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-notification = "~2.4"
tauri-plugin-opener = "~2.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
